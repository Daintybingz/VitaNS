name: Build VitaNS for Nintendo Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Debug - Show current directory
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing files:"
        ls -la
        
    - name: Install devkitPro (Recommended CI Method)
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget https://apt.devkitpro.org/devkitpro-keyring.gpg
        sudo install -o root -g root -m 644 devkitpro-keyring.gpg /usr/share/keyrings/
        echo "deb [signed-by=/usr/share/keyrings/devkitpro-keyring.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
        sudo apt-get update
        sudo apt-get install -y devkitpro-pacman
        sudo dkp-pacman -Sy
        sudo dkp-pacman -S --noconfirm switch-dev
        
    - name: Install dependencies
      run: |
        echo "Installing additional dependencies..."
        sudo dkp-pacman -S --noconfirm \
          switch-sdl2 \
          switch-mesa \
          switch-glm \
          switch-sdl2_ttf \
          switch-sdl2_image \
          cmake \
          make \
          git
        
    - name: Build VitaNS
      run: |
        echo "Building VitaNS..."
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
        make -j$(nproc)
      env:
        DEVKITPRO: /opt/devkitpro
        
    - name: Verify build
      run: |
        echo "Verifying build artifacts..."
        ls -la build/
        if [ -f build/VitaNS.nro ]; then
          echo "✅ Build successful! VitaNS.nro created."
          file build/VitaNS.nro
        else
          echo "❌ Build failed! VitaNS.nro not found."
          exit 1
        fi
        
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: VitaNS-Switch
        path: build/VitaNS.nro
        retention-days: 30 