name: Build VitaNS for Nintendo Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Debug - Show current directory
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing files:"
        ls -la
        
    - name: Install devkitPro (Robust Method)
      run: |
        echo "=== INSTALLING DEVKITPRO USING ROBUST METHOD ==="
        
        echo "Step 1: Update package list"
        sudo apt-get update
        
        echo "Step 2: Install required packages"
        sudo apt-get install -y wget curl gnupg
        
        echo "Step 3: Add devkitPro repository manually"
        sudo apt-get install -y software-properties-common
        sudo apt-add-repository 'deb https://apt.devkitpro.org stable main'
        
        echo "Step 4: Add devkitPro GPG key"
        wget -qO - https://apt.devkitpro.org/devkitpro-pub.gpg | sudo apt-key add -
        
        echo "Step 5: Update package list with devkitPro"
        sudo apt-get update
        
        echo "Step 6: Install devkitPro pacman"
        sudo apt-get install -y devkitpro-pacman
        
        echo "Step 7: Initialize devkitPro pacman"
        sudo dkp-pacman -Sy --noconfirm || true
        
        echo "Step 8: Install switch-dev"
        sudo dkp-pacman -S --noconfirm switch-dev || echo "Warning: switch-dev installation may have failed, continuing..."
        
        echo "=== DEVKITPRO INSTALLATION COMPLETED ==="
        
    - name: Install dependencies
      run: |
        echo "Installing additional dependencies..."
        sudo dkp-pacman -S --noconfirm \
          switch-sdl2 \
          switch-mesa \
          switch-glm \
          switch-sdl2_ttf \
          switch-sdl2_image \
          cmake \
          make \
          git || echo "Warning: Some dependencies may not have installed, continuing..."
        
    - name: Build VitaNS
      run: |
        echo "Building VitaNS..."
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
        make -j$(nproc)
      env:
        DEVKITPRO: /opt/devkitpro
        
    - name: Verify build
      run: |
        echo "Verifying build artifacts..."
        ls -la build/
        if [ -f build/VitaNS.nro ]; then
          echo "✅ Build successful! VitaNS.nro created."
          file build/VitaNS.nro
        else
          echo "❌ Build failed! VitaNS.nro not found."
          exit 1
        fi
        
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: VitaNS-Switch
        path: build/VitaNS.nro
        retention-days: 30 