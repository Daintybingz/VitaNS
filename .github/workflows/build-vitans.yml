name: Build VitaNS for Nintendo Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install devkitPro (Community Mirror)
        run: |
          echo "deb [trusted=yes] https://dkpcommunity.github.io/apt/ ./ " | sudo tee /etc/apt/sources.list.d/devkitpro-community.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman
          sudo dkp-pacman -Sy
          sudo dkp-pacman -S --noconfirm switch-dev

      - name: Install build tools (cmake, make, git)
        run: |
          echo "Installing build tools (cmake, make, git) with apt-get..."
          sudo apt-get update
          sudo apt-get install -y cmake make git

      - name: Install devkitPro Switch dependencies
        run: |
          echo "Installing Switch libraries with dkp-pacman..."
          sudo dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-mesa \
            switch-glm \
            switch-sdl2_ttf \
            switch-sdl2_image

      - name: Build VitaNS
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          make -j$(nproc)
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Verify build
        run: |
          ls -la build/
          if [ -f build/VitaNS.nro ]; then
            echo "✅ Build successful! VitaNS.nro created."
            file build/VitaNS.nro
          else
            echo "❌ Build failed! VitaNS.nro not found."
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: build/VitaNS.nro
          retention-days: 30 