name: Build VitaNS for Nintendo Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify environment
        run: |
          echo "Verifying devkitPro environment..."
          echo "DEVKITPRO: $DEVKITPRO"
          ls -la $DEVKITPRO/
          ls -la $DEVKITPRO/cmake/
          echo "Available tools:"
          which cmake
          which make
          which git
          cmake --version
          make --version
          git --version

      - name: Build VitaNS
        run: |
          echo "Building VitaNS..."
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          make -j$(nproc)

      - name: Verify build
        run: |
          ls -la build/
          if [ -f build/VitaNS.nro ]; then
            echo "✅ Build successful! VitaNS.nro created."
            file build/VitaNS.nro
          else
            echo "❌ Build failed! VitaNS.nro not found."
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: build/VitaNS.nro
          retention-days: 30 