name: Build VitaNS for Nintendo Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (dkp packages)
        run: |
          echo "Installing Switch dependencies with dkp-pacman..."
          dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-mesa \
            switch-glm \
            switch-sdl2_ttf \
            switch-sdl2_image

      - name: Install build tools (system)
        run: |
          echo "Installing build tools with apt..."
          apt-get update
          apt-get install -y cmake make git

      - name: Verify dependencies
        run: |
          echo "Verifying installed dependencies..."
          cmake --version
          make --version
          git --version
          echo "Switch toolchain location: $DEVKITPRO"

      - name: Build VitaNS
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          make -j$(nproc)

      - name: Verify build
        run: |
          ls -la build/
          if [ -f build/VitaNS.nro ]; then
            echo "✅ Build successful! VitaNS.nro created."
            file build/VitaNS.nro
          else
            echo "❌ Build failed! VitaNS.nro not found."
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: build/VitaNS.nro
          retention-days: 30 