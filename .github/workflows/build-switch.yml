name: Build VitaNS Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug environment
        run: |
          echo "Debug: Starting workflow"
          echo "PWD: $PWD"
          echo "SHELL: $SHELL"
          echo "PATH: $PATH"

      - name: Install devkitPro
        run: |
          set -x
          echo "Installing devkitPro"
          sudo apt-get update
          sudo apt-get install -y curl wget
          
          # Test the installer URL first
          echo "Testing devkitPro installer URL..."
          INSTALLER_URL="https://apt.devkitpro.org/install-devkitpro-pacman"
          if curl -f -s "$INSTALLER_URL" > /dev/null; then
            echo "Installer URL is accessible"
          else
            echo "ERROR: Installer URL is not accessible"
            exit 1
          fi
          
          # Install devkitPro using the correct method with error checking
          echo "Downloading and running devkitPro installer..."
          curl -L "$INSTALLER_URL" | sudo bash || {
            echo "ERROR: devkitPro installation failed"
            exit 1
          }
          
          # Initialize pacman
          echo "Initializing pacman..."
          sudo dkp-pacman -Sy || {
            echo "ERROR: pacman initialization failed"
            exit 1
          }
          
          # Install Switch toolchain
          echo "Installing Switch toolchain..."
          sudo dkp-pacman -S --noconfirm switch-dev || {
            echo "ERROR: switch-dev installation failed"
            exit 1
          }
          sudo dkp-pacman -S --noconfirm switch-sdl2 switch-mesa switch-glm switch-sdl2_ttf switch-sdl2_image || {
            echo "ERROR: Switch libraries installation failed"
            exit 1
          }

      - name: Verify toolchain
        run: |
          set -x
          echo "Verifying toolchain"
          echo "DEVKITPRO: $DEVKITPRO"
          ls -la $DEVKITPRO/cmake/
          which cmake && cmake --version
          which make && make --version

      - name: Build VitaNS
        run: |
          set -x
          echo "Building VitaNS"
          cd VitaNS/Vita3K-Switch
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          make -j$(nproc)

      - name: Verify build
        run: |
          set -x
          echo "Verifying build"
          if [ -f VitaNS/Vita3K-Switch/build/VitaNS.nro ]; then
            echo "Build successful!"
            file VitaNS/Vita3K-Switch/build/VitaNS.nro
            ls -la VitaNS/Vita3K-Switch/build/
          else
            echo "Build failed!"
            ls -la VitaNS/Vita3K-Switch/build/ || echo "Build directory does not exist"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: VitaNS/Vita3K-Switch/build/VitaNS.nro
          retention-days: 30 