# Workflow cache buster: 2025-07-07
# This workflow uses a custom Docker image with all dependencies pre-installed
name: Build VitaNS for Nintendo Switch (CI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: .

      - name: Verify environment
        run: |
          set -e
          echo "=== VERIFYING ENVIRONMENT ==="
          docker run --rm ghcr.io/daintybingz/vitans-devkit:latest bash -c "
            echo 'DEVKITPRO: \$DEVKITPRO'
            echo 'Available build tools:'
            which cmake && cmake --version
            which make && make --version
            which git && git --version
            echo 'Switch toolchain:'
            ls -la \$DEVKITPRO/cmake/
          "

      - name: Build VitaNS
        run: |
          set -e
          echo "=== BUILDING VITANS ==="
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/daintybingz/vitans-devkit:latest \
            bash -c "
              cd VitaNS/Vita3K-Switch
              mkdir -p build
              cd build
              pwd
              ls -la
              ls -la ..
              ls -la ../..
              find /workspace
              echo 'GITHUB_WORKSPACE: /workspace'
              echo 'Running cmake with toolchain: \$DEVKITPRO/cmake/Switch.cmake'
              cmake .. -DCMAKE_TOOLCHAIN_FILE=\$DEVKITPRO/cmake/Switch.cmake
              echo 'Running make...'
              make -j\$(nproc)
            "

      - name: Verify build
        run: |
          set -e
          echo "=== VERIFYING BUILD ==="
          ls -la VitaNS/Vita3K-Switch/build/
          if [ -f VitaNS/Vita3K-Switch/build/VitaNS.nro ]; then
            echo "✅ Build successful! VitaNS.nro created."
            file VitaNS/Vita3K-Switch/build/VitaNS.nro
          else
            echo "❌ Build failed! VitaNS.nro not found."
            echo "Build directory contents:"
            ls -la VitaNS/Vita3K-Switch/build/
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: VitaNS/Vita3K-Switch/build/VitaNS.nro
          retention-days: 30 