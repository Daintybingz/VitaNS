# Workflow cache buster: 2025-07-07
# This workflow uses a custom Docker image with all dependencies pre-installed
name: Build VitaNS for Nintendo Switch (CI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/daintybingz/vitans-devkit:latest  # Updated to use custom GHCR image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: .

      - name: Verify environment
        run: |
          echo "=== VERIFYING ENVIRONMENT ==="
          echo "DEVKITPRO: $DEVKITPRO"
          echo "Available build tools:"
          which cmake && cmake --version
          which make && make --version
          which git && git --version
          echo "Switch toolchain:"
          ls -la $DEVKITPRO/cmake/

      - name: Build VitaNS
        run: |
          echo "=== BUILDING VITANS ==="
          cd VitaNS/Vita3K-Switch
          mkdir -p build
          cd build
          echo "Running cmake with toolchain: $DEVKITPRO/cmake/Switch.cmake"
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          echo "Running make..."
          make -j$(nproc)

      - name: Verify build
        run: |
          echo "=== VERIFYING BUILD ==="
          ls -la build/
          if [ -f build/VitaNS.nro ]; then
            echo "✅ Build successful! VitaNS.nro created."
            file build/VitaNS.nro
          else
            echo "❌ Build failed! VitaNS.nro not found."
            echo "Build directory contents:"
            ls -la build/
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: build/VitaNS.nro
          retention-days: 30 