name: Build VitaNS for Nintendo Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install devkitPro
        run: |
          echo "=== Installing devkitPro ==="
          sudo apt-get update
          sudo apt-get install -y curl wget
          
          # Install devkitPro
          curl -L https://github.com/devkitPro/pacman/releases/latest/download/devkitpro-pacman-installer.sh | sudo bash
          sudo dkp-pacman -Sy
          
          # Install Switch toolchain
          sudo dkp-pacman -S --noconfirm switch-dev
          sudo dkp-pacman -S --noconfirm switch-sdl2 switch-mesa switch-glm switch-sdl2_ttf switch-sdl2_image

      - name: Verify toolchain
        run: |
          echo "=== Verifying toolchain ==="
          echo "DEVKITPRO: $DEVKITPRO"
          ls -la $DEVKITPRO/cmake/
          which cmake && cmake --version
          which make && make --version

      - name: Build VitaNS
        run: |
          echo "=== Building VitaNS ==="
          cd VitaNS/Vita3K-Switch
          mkdir -p build
          cd build
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Running cmake..."
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          echo "CMake completed successfully"
          echo "Running make..."
          make -j$(nproc)
          echo "Make completed successfully"
          echo "Build artifacts:"
          ls -la

      - name: Verify build
        run: |
          echo "=== Verifying build ==="
          if [ -f VitaNS/Vita3K-Switch/build/VitaNS.nro ]; then
            echo "✅ Build successful! VitaNS.nro created."
            file VitaNS/Vita3K-Switch/build/VitaNS.nro
            ls -la VitaNS/Vita3K-Switch/build/
          else
            echo "❌ Build failed! VitaNS.nro not found."
            echo "Build directory contents:"
            ls -la VitaNS/Vita3K-Switch/build/ || echo "Build directory does not exist"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: VitaNS/Vita3K-Switch/build/VitaNS.nro
          retention-days: 30 