name: Build VitaNS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install devkitPro
        run: |
          echo "Installing devkitPro manually"
          sudo apt-get update
          sudo apt-get install -y curl wget
          
          # Install devkitPro manually
          sudo apt-get install -y apt-transport-https
          wget -O /usr/local/share/keyring/devkitpro-pub.gpg https://apt.devkitpro.org/devkitpro-pub.gpg
          echo "deb [signed-by=/usr/local/share/keyring/devkitpro-pub.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman
          
          # Install Switch toolchain
          sudo dkp-pacman -Sy
          sudo dkp-pacman -S --noconfirm switch-dev
          sudo dkp-pacman -S --noconfirm switch-sdl2 switch-mesa switch-glm switch-sdl2_ttf switch-sdl2_image

      - name: Build
        run: |
          echo "Building VitaNS"
          cd VitaNS/Vita3K-Switch
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: VitaNS/Vita3K-Switch/build/VitaNS.nro
          retention-days: 30 