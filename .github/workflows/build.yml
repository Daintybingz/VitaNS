name: Build VitaNS for Switch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install devkitPro
      run: |
        echo "Installing devkitPro..."
        wget https://github.com/devkitPro/pacman/releases/latest/download/devkitpro-pacman.deb
        sudo apt install ./devkitpro-pacman.deb
        
        echo "Installing Switch toolchain..."
        sudo dkp-pacman -S --noconfirm switch-dev
        
    - name: Install dependencies
      run: |
        echo "Installing additional dependencies..."
        sudo dkp-pacman -S --noconfirm \
          switch-sdl2 \
          switch-mesa \
          switch-glm \
          switch-sdl2_ttf \
          switch-sdl2_image \
          cmake \
          make \
          git
        
    - name: Build VitaNS
      run: |
        echo "Building VitaNS..."
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
        make -j$(nproc)
      env:
        DEVKITPRO: /opt/devkitpro
        
    - name: Verify build
      run: |
        echo "Verifying build artifacts..."
        ls -la build/
        if [ -f build/VitaNS.nro ]; then
          echo "✅ Build successful! VitaNS.nro created."
          file build/VitaNS.nro
        else
          echo "❌ Build failed! VitaNS.nro not found."
          exit 1
        fi
        
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: VitaNS-Switch
        path: build/VitaNS.nro
        retention-days: 30 