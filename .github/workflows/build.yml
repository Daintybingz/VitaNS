name: Build VitaNS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20240301
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug environment
        run: |
          echo "Debug: Starting Docker-based build"
          echo "PWD: $PWD"
          echo "DEVKITPRO: $DEVKITPRO"
          echo "Directory contents:"
          ls -la
          echo "Vita3K-Switch directory:"
          ls -la Vita3K-Switch/ || echo "Vita3K-Switch directory not found"

      - name: Clean build directory
        run: |
          rm -rf Vita3K-Switch/build

      - name: Install Switch portlibs
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm switch-harfbuzz switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-mesa switch-glm

      - name: Build
        run: |
          echo "Building VitaNS"
          cd Vita3K-Switch
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VitaNS-Switch
          path: Vita3K-Switch/build/VitaNS.nro
          retention-days: 30 